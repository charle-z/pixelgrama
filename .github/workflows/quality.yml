name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod verify
      - run: node --test internal/app/web/editor_test.js internal/app/web/remix_test.js internal/app/web/exploration_test.js internal/app/web/challenge_test.js
      - run: test -z "$(gofmt -l .)"
      - run: go test -race ./...
      - run: go vet ./...
      - run: CGO_ENABLED=0 go build -trimpath ./cmd/pixelgrama
      - run: git diff --check
      - name: Build deployment image
        run: |
          docker build \
            --build-arg COMMIT="${GITHUB_SHA}" \
            --build-arg REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --build-arg PR_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/pull/${{ github.event.pull_request.number }}" \
            --tag pixelgrama:ci \
            --tag ghcr.io/charle-z/pixelgrama:latest \
            .
      - name: Smoke hardened Compose runtime
        run: |
          export COMPOSE_PROJECT_NAME=pixelgrama
          cleanup() {
            docker compose logs --no-color || true
            docker compose down --volumes --remove-orphans || true
          }
          trap cleanup EXIT
          docker volume create pixelgrama_pixelgrama-data
          docker run --rm \
            --user 0:0 \
            --entrypoint /bin/sh \
            --volume pixelgrama_pixelgrama-data:/data \
            ghcr.io/charle-z/pixelgrama:latest \
            -c 'touch /data/.coolify-owned && chown 0:0 /data && chmod 0755 /data'
          docker compose config | grep -q 'pull_policy: always'
          docker compose up --detach --pull never
          for attempt in $(seq 1 30); do
            state="$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps --quiet pixelgrama)" 2>/dev/null || true)"
            if [ "${state}" = healthy ]; then
              break
            fi
            if [ "${state}" = unhealthy ]; then
              docker compose logs --no-color
              exit 1
            fi
            sleep 1
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps --quiet pixelgrama)")" = healthy
          docker compose exec --no-TTY pixelgrama wget -q -O - http://127.0.0.1:8080/readyz \
            | jq -e '.status == "ready"'
          docker compose exec --no-TTY pixelgrama wget -q -O - http://127.0.0.1:8080/challenge \
            | jq -e '.catalog_version == 1 and (.date | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$")) and (.slug | test("^[a-z0-9]+(-[a-z0-9]+)*$")) and (.prompt_es | length > 0) and (.prompt_en | length > 0)'
          docker compose exec --no-TTY pixelgrama wget -q -O - http://127.0.0.1:8080/wall \
            | grep -q 'id="daily-challenge"'
          docker compose exec --no-TTY pixelgrama wget -q -O - http://127.0.0.1:8080/wall \
            | grep -q 'fetch("/challenge"'
          docker compose exec --no-TTY pixelgrama wget -q -O - http://127.0.0.1:8080/wall \
            | grep -q 'id="tool-pencil"'
          docker compose exec --no-TTY pixelgrama wget -q -O - http://127.0.0.1:8080/wall \
            | grep -q 'pixelgrama:draft'
          docker compose exec --no-TTY pixelgrama /usr/local/bin/pixelgrama backup --output /data/ci-backup.db
          payload="$(jq -nc '{pixels: [range(0; 256) | . % 16], alias: "CI"}')"
          postcard_id="$(docker compose exec --no-TTY pixelgrama wget -q -O - \
            --header 'Content-Type: application/json' \
            --post-data "${payload}" \
            http://127.0.0.1:8080/postcard | jq -r '.id')"
          test "${postcard_id}" -gt 0
          docker compose exec --no-TTY pixelgrama wget -q -O - "http://127.0.0.1:8080/p/${postcard_id}" \
            | grep -q "wall?remix=${postcard_id}"
          docker compose exec --no-TTY pixelgrama wget -q -O - "http://127.0.0.1:8080/p/${postcard_id}.json" \
            | jq -e --argjson id "${postcard_id}" '.id == $id and .format_version == 1 and .palette_id == "vga16" and (.content_hash | test("^[0-9a-f]{64}$"))'
          docker compose exec --no-TTY pixelgrama wget -q -O - "http://127.0.0.1:8080/p/${postcard_id}.png" \
            | head -c 8 | od -An -tx1 | tr -d ' \n' | grep -q '^89504e470d0a1a0a$'
          child_payload="$(jq -nc --argjson parent "${postcard_id}" '{pixels: [range(0; 256) | (. + 1) % 16], alias: "REMIX", parent_id: $parent}')"
          child_id="$(docker compose exec --no-TTY pixelgrama wget -q -O - \
            --header 'Content-Type: application/json' \
            --post-data "${child_payload}" \
            http://127.0.0.1:8080/postcard | jq -r '.id')"
          test "${child_id}" -gt "${postcard_id}"
          docker compose exec --no-TTY pixelgrama wget -q -O - "http://127.0.0.1:8080/p/${child_id}.json" \
            | jq -e --argjson parent "${postcard_id}" '.parent_id == $parent'
          first_page="$(docker compose exec --no-TTY pixelgrama wget -q -O - 'http://127.0.0.1:8080/wall?format=json&limit=1')"
          first_id="$(printf '%s' "${first_page}" | jq -r '.postcards[0].id')"
          before_id="$(printf '%s' "${first_page}" | jq -r '.next_before_id')"
          test "${first_id}" -eq "${child_id}"
          test "${before_id}" -eq "${child_id}"
          third_payload="$(jq -nc '{pixels: [range(0; 256) | (. + 2) % 16], alias: "NEW"}')"
          third_id="$(docker compose exec --no-TTY pixelgrama wget -q -O - \
            --header 'Content-Type: application/json' \
            --post-data "${third_payload}" \
            http://127.0.0.1:8080/postcard | jq -r '.id')"
          test "${third_id}" -gt "${child_id}"
          docker compose exec --no-TTY pixelgrama wget -q -O - \
            "http://127.0.0.1:8080/wall?format=json&limit=1&before_id=${before_id}" \
            | jq -e --argjson parent "${postcard_id}" --argjson newest "${third_id}" '(.postcards | length) == 1 and .postcards[0].id == $parent and .postcards[0].id != $newest'
          docker compose exec --no-TTY pixelgrama wget -q -O - http://127.0.0.1:8080/random \
            | grep -q 'REMIX'
          hide_log="$(mktemp)"
          docker compose exec --no-TTY pixelgrama /usr/local/bin/pixelgrama admin hide \
            --id "${postcard_id}" --reason "CI moderation smoke" 2>"${hide_log}" \
            | jq -e --argjson id "${postcard_id}" '.id == $id and .status == "hidden"'
          grep -q 'action=hide' "${hide_log}"
          ! grep -q 'CI moderation smoke' "${hide_log}"
          docker compose exec --no-TTY pixelgrama /usr/local/bin/pixelgrama admin list --status hidden --limit 10 \
            | jq -e --argjson id "${postcard_id}" 'any(.[]; .id == $id and .status == "hidden" and .reason == "CI moderation smoke")'
          docker compose exec --no-TTY pixelgrama wget -q -O - 'http://127.0.0.1:8080/wall?format=json' \
            | jq -e --argjson id "${postcard_id}" 'all(.postcards[]; .id != $id)'
          restore_log="$(mktemp)"
          docker compose exec --no-TTY pixelgrama /usr/local/bin/pixelgrama admin restore \
            --id "${postcard_id}" --reason "CI restore smoke" 2>"${restore_log}" \
            | jq -e --argjson id "${postcard_id}" '.id == $id and .status == "visible"'
          grep -q 'action=restore' "${restore_log}"
          ! grep -q 'CI restore smoke' "${restore_log}"
          docker compose exec --no-TTY pixelgrama wget -q -O - 'http://127.0.0.1:8080/wall?format=json' \
            | jq -e --argjson id "${postcard_id}" 'any(.postcards[]; .id == $id)'
          docker compose exec --no-TTY pixelgrama cat /proc/1/status \
            | awk '$1 == "Uid:" { found=1; exit !($2 == 10001 && $3 == 10001 && $4 == 10001 && $5 == 10001) } END { if (!found) exit 1 }'
          docker compose exec --no-TTY pixelgrama cat /proc/1/status \
            | awk '$1 == "Gid:" { found=1; exit !($2 == 10001 && $3 == 10001 && $4 == 10001 && $5 == 10001) } END { if (!found) exit 1 }'
          docker compose exec --no-TTY pixelgrama cat /proc/1/status \
            | awk '$1 == "CapEff:" { found=1; exit !($2 == "0000000000000000") } END { if (!found) exit 1 }'
          docker compose exec --no-TTY pixelgrama wget -q -O - http://127.0.0.1:8080/version \
            | jq -e --arg sha "${GITHUB_SHA}" '.commit == $sha'

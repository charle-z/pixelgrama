name: Container image

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read
  packages: write
  pull-requests: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - id: provenance
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          pr_url="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/commits/${SHA}/pulls" \
            | jq -r '.[0].html_url // empty')"
          test -n "${pr_url}"
          echo "pr_url=${pr_url}" >> "${GITHUB_OUTPUT}"
      - uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          build-args: |
            COMMIT=${{ github.sha }}
            REPO_URL=${{ github.server_url }}/${{ github.repository }}
            PR_URL=${{ steps.provenance.outputs.pr_url }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke published image
        env:
          IMAGE: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          SHA: ${{ github.sha }}
        run: |
          docker run --detach --rm --name pixelgrama-smoke --publish 127.0.0.1:18080:8080 "${IMAGE}"
          trap 'docker rm --force pixelgrama-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/healthz >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18080/healthz | jq -e '.status == "ok"'
          curl --fail --silent http://127.0.0.1:18080/readyz | jq -e '.status == "ready"'
          docker exec pixelgrama-smoke /usr/local/bin/pixelgrama backup --output /data/image-smoke-backup.db
          payload="$(jq -nc '{pixels: [range(0; 256) | . % 16], alias: "IMAGE"}')"
          postcard_id="$(curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            --data "${payload}" \
            http://127.0.0.1:18080/postcard | jq -r '.id')"
          hide_log="$(mktemp)"
          docker exec pixelgrama-smoke /usr/local/bin/pixelgrama admin hide \
            --id "${postcard_id}" --reason "Image moderation smoke" 2>"${hide_log}" \
            | jq -e --argjson id "${postcard_id}" '.id == $id and .status == "hidden"'
          grep -q 'action=hide' "${hide_log}"
          ! grep -q 'Image moderation smoke' "${hide_log}"
          curl --fail --silent 'http://127.0.0.1:18080/wall?format=json' \
            | jq -e --argjson id "${postcard_id}" 'all(.postcards[]; .id != $id)'
          restore_log="$(mktemp)"
          docker exec pixelgrama-smoke /usr/local/bin/pixelgrama admin restore \
            --id "${postcard_id}" --reason "Image restore smoke" 2>"${restore_log}" \
            | jq -e --argjson id "${postcard_id}" '.id == $id and .status == "visible"'
          grep -q 'action=restore' "${restore_log}"
          ! grep -q 'Image restore smoke' "${restore_log}"
          curl --fail --silent 'http://127.0.0.1:18080/wall?format=json' \
            | jq -e --argjson id "${postcard_id}" 'any(.postcards[]; .id == $id)'
          curl --fail --silent http://127.0.0.1:18080/version | jq -e --arg sha "${SHA}" '.commit == $sha'
